appId: com.calvary.blocker
productName: Calvary Blocker
directories:
  output: dist
  buildResources: assets
files:
  - "**/*"
  - "!node_modules"
extraResources:
  - from: "../../PornBlockerAgent"
    to: "PornBlockerAgent"
    filter:
      - "**/*"
      - "!node_modules"
      - "!.git"
mac:
  target: dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
win:
  target: nsis
  icon: assets/icon.ico
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Utility
