<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" style="background-color: #030712;">
  <defs>
    <style>
      @keyframes pulse-glow {
        0% { filter: drop-shadow(0 0 15px rgba(34,211,238,0.4)); transform: scale(1); }
        100% { filter: drop-shadow(0 0 25px rgba(34,211,238,0.8)); transform: scale(1.05); }
      }
      @keyframes float {
        0% { transform: translate(400px, 200px) translateY(0px); }
        100% { transform: translate(400px, 200px) translateY(-10px); }
      }
      .shield-float { animation: float 6s ease-in-out infinite alternate; transform-origin: center; }
      .dove-pulse { animation: pulse-glow 3s ease-in-out infinite alternate; transform-origin: center; }
    </style>
    <radialGradient id="bg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.5" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" opacity="0.8" />
    </pattern>
    <linearGradient id="shield-solid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <mask id="dove-cutout">
