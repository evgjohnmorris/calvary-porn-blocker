<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="shield-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1f2937" stroke-width="0.4" opacity="0.5"/>
    </pattern>
    <!-- Dove mask from hero-banner -->
    <mask id="dove" x="-50%" y="-50%" width="200%" height="200%">
      <rect x="-200" y="-200" width="400" height="400" fill="white"/>
      <g transform="translate(0, -10) scale(1.7) translate(-351.75, -227.41)">
        <path d="m 349.75585,200.60294 c -0.22525,0.0423 -0.42821,0.62712 -0.62042,1.75132 -0.17216,1.00688 -0.82851,3.3 -1.46073,5.09686 -0.63225,1.79687 -1.71399,4.93864 -2.40316,6.97384 l -1.24869,3.69896 -0.87958,0.16493 c -0.48291,0.0906 -1.97226,0.0874 -3.30629,-0.008 -6.38374,-0.45564 -9.68763,-2.10147 -10.07593,-5.01047 -0.10878,-0.81494 -0.25227,-1.05592 -0.66755,-1.11519 -0.44751,-0.0638 -0.55708,0.0866 -0.69895,0.97382 -0.2634,1.64721 -1.66926,4.42361 -4.20943,8.32463 -2.76061,4.23956 -3.47826,5.87678 -3.66755,8.37959 -0.47146,6.23374 2.92882,10.58943 9.39269,12.02359 2.34143,0.5195 6.9557,0.74664 9.57332,0.4712 l 2.0733,-0.2199 0,1.28797 c 0,2.75952 1.1839,4.84321 3.18849,5.6309 1.02987,0.40468 1.43416,1.40188 1.28796,3.16493 -0.1722,2.07647 0.34614,1.76669 1.67277,-0.99739 1.72666,-3.59755 3.26171,-5.07955 6.43981,-6.2042 1.48277,-0.52472 2.0654,-0.57219 7.26441,-0.59686 5.47277,-0.026 5.72003,-0.0501 7.64138,-0.71466 7.49646,-2.59296 12.39141,-8.96692 13.83772,-18.00789 0.54131,-3.38378 0.56766,-3.26702 -0.64398,-3.26702 -0.86387,0 -1.22925,0.1782 -2.25393,1.09948 -2.64898,2.38166 -4.83759,2.90377 -10.34295,2.44241 -3.8546,-0.32302 -6.65193,-0.16475 -8.32463,0.47121 -0.3655,0.13896 -0.66753,0.17527 -0.66753,0.0864 0,-0.61157 4.40328,-7.9512 7.85341,-13.09951 0.95743,-1.4287 1.70272,-2.62913 1.65707,-2.6623 -0.0456,-0.0331 -0.48795,-0.30036 -0.98168,-0.59687 l -0.89529,-0.54189 -1.32722,0.51048 c -8.22025,3.12344 -14.34341,0.2843 -16.32726,-7.56284 -0.34066,-1.34747 -0.6243,-1.99552 -0.87958,-1.94765 z" fill="black"/>
      </g>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#grid)"/>

  <!-- Ambient glow behind shield -->
  <circle cx="128" cy="118" r="80" fill="rgba(56,189,248,0.18)" filter="url(#soft-glow)"/>

  <!-- Shield shape centered -->
  <g transform="translate(128, 118)">
    <!-- Glow halo -->
    <circle cx="0" cy="0" r="70" fill="rgba(56,189,248,0.12)" filter="url(#soft-glow)"/>
    <!-- Shield body with dove mask -->
    <path d="M 0 -88 L 73 -66 L 73 15 C 73 58 37 80 0 95 C -37 80 -73 58 -73 15 L -73 -66 Z"
          fill="url(#shield-fill)" stroke="#38bdf8" stroke-width="2"
          filter="url(#glow)" mask="url(#dove)"/>
    <!-- Shield inner edge -->
    <path d="M 0 -78 L 63 -59 L 63 13 C 63 51 32 71 0 83 C -32 71 -63 51 -63 13 L -63 -59 Z"
          fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
  </g>

  <!-- Corner brackets (aesthetic detail) -->
  <path d="M 10 22 L 10 10 L 22 10" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M 246 22 L 246 10 L 234 10" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M 10 234 L 10 246 L 22 246" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M 246 234 L 246 246 L 234 246" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Bottom cyan accent line -->
  <rect x="96" y="254" width="64" height="2" fill="#38bdf8" opacity="0.6"/>
</svg>
