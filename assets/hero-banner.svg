<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    
    <radialGradient id="orb-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>

    <!-- Text Shimmer -->
    <linearGradient id="text-shimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="20%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
      <animate attributeName="x1" values="0%;-200%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;0%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Shield Gradients -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="neon-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glass-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity="0.9"/>
    </filter>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .orb { animation: drift 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); }
    .orb-slow { animation: drift-slow 30s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); }
    .orb-rev { animation: drift-rev 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); }

    @keyframes drift {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(150px, -100px) scale(1.2); }
    }
    @keyframes drift-slow {
      0% { transform: translate(0px, 0px) scale(1.2); }
      100% { transform: translate(-200px, 150px) scale(0.8); }
    }
    @keyframes drift-rev {
      0% { transform: translate(0px, 0px) scale(0.9); }
      100% { transform: translate(-100px, -200px) scale(1.3); }
    }

    .data-flow {
      stroke-dasharray: 40 400;
      animation: flow 5s infinite linear;
    }
    .data-flow-fast {
      stroke-dasharray: 20 500;
      animation: flow-fast 3s infinite linear;
    }
    @keyframes flow {
      0% { stroke-dashoffset: 440; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flow-fast {
      0% { stroke-dashoffset: 520; }
      100% { stroke-dashoffset: 0; }
    }

    .threat {
      animation: attack 4s infinite cubic-bezier(0.6, 0.05, 0.1, 1);
    }
    @keyframes attack {
      0% { transform: translate(-600px, 0); opacity: 0; }
      10% { opacity: 1; }
      75% { transform: translate(-120px, 0); opacity: 1; r: 6px; fill: #ef4444; stroke-width: 0; }
      85% { transform: translate(-100px, 0); opacity: 0; r: 25px; fill: transparent; stroke: #ef4444; stroke-width: 3; }
      100% { transform: translate(-90px, 0); opacity: 0; r: 40px; fill: transparent; stroke: #ef4444; stroke-width: 0; }
    }

    .float {
      animation: hover 8s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes hover {
      0%, 100% { transform: translateY(0) rotate(45deg); }
      50% { transform: translateY(-20px) rotate(45deg); }
    }
    
    .spin {
      transform-origin: center;
      animation: rotate 25s infinite linear;
    }
    .spin-rev {
      transform-origin: center;
      animation: rotate 35s infinite linear reverse;
    }
    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    .pulse {
      animation: glow-pulse 4s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes glow-pulse {
      0% { opacity: 0.5; filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.5)); }
      100% { opacity: 1; filter: drop-shadow(0 0 20px rgba(16, 185, 129, 1)); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="400" fill="#020617" />
  <rect width="1200" height="400" fill="url(#bg-glow)" />
  
  <!-- Liquid Orbs -->
  <g opacity="0.7">
    <circle cx="300" cy="100" r="500" fill="url(#orb-indigo)" class="orb" />
    <circle cx="1000" cy="300" r="600" fill="url(#orb-blue)" class="orb-slow" />
    <circle cx="700" cy="150" r="400" fill="url(#orb-emerald)" class="orb-rev" />
  </g>

  <!-- Isometric Network Grid -->
  <g transform="translate(850, 200) scale(1, 0.5) rotate(45)">
    <!-- Base grid -->
    <rect x="-1000" y="-1000" width="2000" height="2000" fill="url(#grid)" />
    
    <!-- Data streams (Glowing blue/green lines traveling across the grid) -->
    <!-- X-axis streams -->
    <line x1="-1000" y1="160" x2="1000" y2="160" stroke="#38bdf8" stroke-width="4" filter="url(#neon-blue)" class="data-flow" />
    <line x1="-1000" y1="320" x2="1000" y2="320" stroke="#10b981" stroke-width="3" filter="url(#neon-green)" class="data-flow-fast" style="animation-delay: -1.2s" />
    <line x1="-1000" y1="-240" x2="1000" y2="-240" stroke="#38bdf8" stroke-width="5" filter="url(#neon-blue)" class="data-flow" style="animation-delay: -3.5s" />
    
    <!-- Y-axis streams -->
    <line x1="80" y1="-1000" x2="80" y2="1000" stroke="#4f46e5" stroke-width="4" filter="url(#neon-blue)" class="data-flow" style="animation-delay: -0.7s" />
    <line x1="-400" y1="-1000" x2="-400" y2="1000" stroke="#10b981" stroke-width="5" filter="url(#neon-green)" class="data-flow-fast" style="animation-delay: -2.1s" />
    <line x1="560" y1="-1000" x2="560" y2="1000" stroke="#38bdf8" stroke-width="3" filter="url(#neon-blue)" class="data-flow" style="animation-delay: -4s" />

    <!-- Isometric Shield Construct base -->
    <rect x="-140" y="-140" width="280" height="280" fill="rgba(16, 185, 129, 0.03)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="2" />
    <circle cx="0" cy="0" r="180" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" class="spin" />
    <circle cx="0" cy="0" r="240" fill="none" stroke="rgba(79, 70, 229, 0.35)" stroke-width="2.5" stroke-dasharray="15 60 80 30" class="spin-rev" />
    
    <!-- Threat attacks (moving towards center along X axis) -->
    <g class="threat" style="animation-delay: 0s;">
      <circle cx="0" cy="-80" r="8" fill="#ef4444" filter="url(#neon-red)" />
    </g>
    <g class="threat" style="animation-delay: 1.5s;">
      <circle cx="0" cy="240" r="6" fill="#ef4444" filter="url(#neon-red)" />
    </g>
    <g class="threat" style="animation-delay: 2.8s;">
      <circle cx="0" cy="0" r="10" fill="#ef4444" filter="url(#neon-red)" />
    </g>
  </g>

  <!-- Central Floating Crystal / Shield Structure (Non-isometric overlapping) -->
  <g transform="translate(850, 200)" class="float" filter="url(#shadow)">
    <!-- Base diamond -->
    <path d="M 0 -100 L 100 0 L 0 100 L -100 0 Z" fill="url(#shield-grad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" filter="url(#glass-blur)" />
    <!-- Inner glowing diamond -->
    <path d="M 0 -65 L 65 0 L 0 65 L -65 0 Z" fill="none" stroke="#10b981" stroke-width="5" filter="url(#neon-green)" class="pulse" />
    <!-- Core dot -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" filter="url(#neon-blue)" class="pulse" />
  </g>

  <!-- Typography & HUD Overlay -->
  <g transform="translate(80, 180)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="72" font-weight="900" fill="url(#text-shimmer)" letter-spacing="-2">
      CALVARY
    </text>
    <text x="5" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#64748b" letter-spacing="6">
      PORN BLOCKER
    </text>
    
    <g transform="translate(5, 100)" opacity="0.9">
      <rect x="0" y="0" width="220" height="36" rx="18" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
      <circle cx="18" cy="18" r="5" fill="#10b981" class="pulse" filter="url(#neon-green)" />
      <text x="36" y="23" font-family="-apple-system, 'SF Mono', monospace" font-size="13" fill="#6ee7b7" font-weight="700" letter-spacing="1.5">
        DNS SHIELD ACTIVE
      </text>
    </g>
  </g>

</svg>
