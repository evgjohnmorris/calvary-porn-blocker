<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background -->
    <radialGradient id="bg-grad" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#111827" /> <!-- Gray 900 -->
      <stop offset="100%" stop-color="#030712" /> <!-- Gray 950 -->
    </radialGradient>

    <!-- Sleek Text Shimmer -->
    <linearGradient id="metal-text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0.15)" /> <!-- Cyan 400 -->
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0)" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="glow-sharp" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Precise Grid -->
    <pattern id="fine-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.5" />
      <circle cx="0" cy="0" r="1" fill="#374151" opacity="0.8" />
    </pattern>
  </defs>

  <style>
    /* CSS Animations for high-performance fluid motion */
    .spin-slow { animation: spin 40s linear infinite; transform-origin: center; }
    .spin-slow-reverse { animation: spin-rev 50s linear infinite; transform-origin: center; }
    .spin-fast { animation: spin 20s linear infinite; transform-origin: center; }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-rev { 100% { transform: rotate(-360deg); } }

    .float { animation: floating 6s ease-in-out infinite alternate; }
    @keyframes floating {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    .pulse-glow { animation: pulse 3s ease-in-out infinite alternate; }
    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* Packet flow */
    .packet-1 { animation: flow-1 3s linear infinite; opacity: 0; }
    @keyframes flow-1 {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    
    .status-ping { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; transform-origin: center; }
    @keyframes ping {
      75%, 100% { transform: scale(2.5); opacity: 0; }
    }
  </style>

  <!-- Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#fine-grid)" />

  <!-- Ambient Glow -->
  <circle cx="850" cy="200" r="250" fill="url(#cyan-glow)" filter="url(#blur-heavy)" class="pulse-glow" />
  <circle cx="200" cy="300" r="200" fill="rgba(99, 102, 241, 0.08)" filter="url(#blur-heavy)" /> <!-- Indigo tint -->

  <!-- Architectural Accents -->
  <line x1="0" y1="399" x2="1200" y2="399" stroke="#1e293b" stroke-width="1" />
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#1e293b" stroke-width="1" />
  <!-- Corner brackets -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#475569" stroke-width="1.5" />
  <path d="M 1180 40 L 1180 20 L 1160 20" fill="none" stroke="#475569" stroke-width="1.5" />
  <path d="M 20 360 L 20 380 L 40 380" fill="none" stroke="#475569" stroke-width="1.5" />
  <path d="M 1180 360 L 1180 380 L 1160 380" fill="none" stroke="#475569" stroke-width="1.5" />

  <!-- The Zero-Trust Perimeter (Right Side) -->
  <g transform="translate(850, 200)" class="float">
    <!-- Outer dashed boundary -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" class="spin-slow" />
    
    <!-- Shield Perimeter -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(34, 211, 238, 0.15)" stroke-width="15" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="60 20 10 20" class="spin-slow-reverse" filter="url(#glow-sharp)" />
    
    <!-- Inner Core Ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#4f46e5" stroke-width="1" stroke-dasharray="4 2 2 2 10 2" class="spin-fast" />
    
    <!-- Central Node -->
    <circle cx="0" cy="0" r="8" fill="#22d3ee" filter="url(#glow-sharp)" class="pulse-glow" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    
    <!-- Radial Lines -->
    <g stroke="#1e293b" stroke-width="1" class="spin-slow">
      <line x1="0" y1="-160" x2="0" y2="-180" />
      <line x1="0" y1="160" x2="0" y2="180" />
      <line x1="-160" y1="0" x2="-180" y2="0" />
      <line x1="160" y1="0" x2="180" y2="0" />
    </g>
    
    <!-- Flow Pathways (curved) -->
    <path id="path1" d="M -250 150 Q -100 50 0 0" fill="none" stroke="rgba(34, 211, 238, 0.2)" stroke-width="1" />
    <path id="path2" d="M 200 -200 Q 100 -50 0 0" fill="none" stroke="rgba(34, 211, 238, 0.2)" stroke-width="1" />
    <path id="path3" d="M -200 -180 Q -100 -80 0 0" fill="none" stroke="rgba(34, 211, 238, 0.2)" stroke-width="1" />

    <!-- Flow Particles -->
    <circle r="2.5" fill="#22d3ee" filter="url(#glow-sharp)">
      <animateMotion dur="4s" repeatCount="indefinite" path="M -250 150 Q -100 50 0 0" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="2" fill="#818cf8" filter="url(#glow-sharp)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 200 -200 Q 100 -50 0 0" begin="1s" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="3s" repeatCount="indefinite" begin="1s" />
    </circle>
    <circle r="2" fill="#22d3ee" filter="url(#glow-sharp)">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M -200 -180 Q -100 -80 0 0" begin="0.5s" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="3.5s" repeatCount="indefinite" begin="0.5s" />
    </circle>
  </g>

  <!-- Typography & Information (Left Side) -->
  <g transform="translate(100, 200)">
    
    <!-- Small technical eyebrow text -->
    <text x="0" y="-80" font-family="'SF Mono', Consolas, monospace" font-size="12" fill="#64748b" letter-spacing="2">
      // V1.0.0 &#183; KERNEL-LEVEL PROTECTION
    </text>

    <!-- Main Branding -->
    <text x="-3" y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="72" font-weight="800" fill="url(#metal-text)" letter-spacing="-2.5">
      CALVARY
    </text>
    <text x="2" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#94a3b8" letter-spacing="8">
      PORN BLOCKER
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#64748b" letter-spacing="0.5">
      Zero-trust content filtering and absolute perimeter defense.
    </text>

    <!-- Sleek Status Pill -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      
      <!-- Pulsing Dot -->
      <g transform="translate(16, 14)">
        <circle cx="0" cy="0" r="4" fill="#10b981" filter="url(#glow-sharp)" />
        <circle cx="0" cy="0" r="4" fill="#10b981" class="status-ping" />
      </g>
      
      <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" fill="#34d399" font-weight="600" letter-spacing="1">
        SYSTEM ACTIVE
      </text>
    </g>

    <!-- Data metric (just for aesthetic technical feel) -->
    <g transform="translate(200, 110)">
      <rect x="0" y="0" width="140" height="28" rx="4" fill="rgba(30, 41, 59, 0.4)" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#94a3b8">
        LATENCY: <tspan fill="#22d3ee">1.2ms</tspan>
      </text>
    </g>
  </g>
</svg>

