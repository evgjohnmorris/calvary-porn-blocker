<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background -->
    <radialGradient id="bg-grad" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#111827" /> <!-- Gray 900 -->
      <stop offset="100%" stop-color="#030712" /> <!-- Gray 950 -->
    </radialGradient>

    <!-- Sleek Text Shimmer -->
    <linearGradient id="metal-text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0.15)" /> <!-- Cyan 400 -->
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0)" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="glow-sharp" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Precise Grid -->
    <pattern id="fine-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.5" />
      <circle cx="0" cy="0" r="1" fill="#374151" opacity="0.8" />
    </pattern>
    <!-- Shield Solid Gradient -->
    <linearGradient id="shield-solid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Dove Cutout Mask -->
    <mask id="dove-cutout" x="-50%" y="-50%" width="200%" height="200%">
      <rect x="-200" y="-200" width="400" height="400" fill="white" />
      <g transform="translate(0, -10) scale(1.7) translate(-351.75, -227.41)">
        <path d="m 349.75585,200.60294 c -0.22525,0.0423 -0.42821,0.62712 -0.62042,1.75132 -0.17216,1.00688 -0.82851,3.3 -1.46073,5.09686 -0.63225,1.79687 -1.71399,4.93864 -2.40316,6.97384 l -1.24869,3.69896 -0.87958,0.16493 c -0.48291,0.0906 -1.97226,0.0874 -3.30629,-0.008 -6.38374,-0.45564 -9.68763,-2.10147 -10.07593,-5.01047 -0.10878,-0.81494 -0.25227,-1.05592 -0.66755,-1.11519 -0.44751,-0.0638 -0.55708,0.0866 -0.69895,0.97382 -0.2634,1.64721 -1.66926,4.42361 -4.20943,8.32463 -2.76061,4.23956 -3.47826,5.87678 -3.66755,8.37959 -0.47146,6.23374 2.92882,10.58943 9.39269,12.02359 2.34143,0.5195 6.9557,0.74664 9.57332,0.4712 l 2.0733,-0.2199 0,1.28797 c 0,2.75952 1.1839,4.84321 3.18849,5.6309 1.02987,0.40468 1.43416,1.40188 1.28796,3.16493 -0.1722,2.07647 0.34614,1.76669 1.67277,-0.99739 1.72666,-3.59755 3.26171,-5.07955 6.43981,-6.2042 1.48277,-0.52472 2.0654,-0.57219 7.26441,-0.59686 5.47277,-0.026 5.72003,-0.0501 7.64138,-0.71466 7.49646,-2.59296 12.39141,-8.96692 13.83772,-18.00789 0.54131,-3.38378 0.56766,-3.26702 -0.64398,-3.26702 -0.86387,0 -1.22925,0.1782 -2.25393,1.09948 -2.64898,2.38166 -4.83759,2.90377 -10.34295,2.44241 -3.8546,-0.32302 -6.65193,-0.16475 -8.32463,0.47121 -0.3655,0.13896 -0.66753,0.17527 -0.66753,0.0864 0,-0.61157 4.40328,-7.9512 7.85341,-13.09951 0.95743,-1.4287 1.70272,-2.62913 1.65707,-2.6623 -0.0456,-0.0331 -0.48795,-0.30036 -0.98168,-0.59687 l -0.89529,-0.54189 -1.32722,0.51048 c -8.22025,3.12344 -14.34341,0.2843 -16.32726,-7.56284 -0.34066,-1.34747 -0.6243,-1.99552 -0.87958,-1.94765 z m 0.93456,10.53144 c 0.0911,-0.009 0.17928,0.0508 0.29842,0.14136 1.73863,1.32094 5.72065,2.31133 10.11521,2.5131 3.23504,0.14852 3.32696,0.16357 3.18063,0.6754 -0.3018,1.0556 -2.7754,4.89455 -5.8508,9.07068 -1.73039,2.34975 -3.59445,4.98303 -4.13875,5.8508 -0.96336,1.53591 -0.97771,1.5909 -0.53403,2.08116 0.25068,0.277 0.8319,0.74208 1.29581,1.02879 l 0.84817,0.51833 1.31152,-1.23299 c 0.72005,-0.67844 1.84002,-1.48971 2.49739,-1.80628 2.52638,-1.21662 3.40853,-1.32778 11.87438,-1.51571 4.42304,-0.0982 8.07141,-0.16139 8.10472,-0.14136 0.0333,0.02 -0.11667,0.70513 -0.32985,1.52357 -1.32057,5.07001 -6.73862,10.15276 -12.73038,11.93719 -2.02745,0.6038 -4.05425,0.69529 -7.98694,0.37696 -4.29217,-0.34741 -6.81149,0.55426 -9.58116,3.41624 -0.77961,0.80559 -1.45814,1.45899 -1.50787,1.45288 -0.0497,-0.006 -0.49974,-0.22389 -0.99737,-0.48691 -1.75269,-0.92636 -2.22134,-2.61916 -1.42147,-5.15969 0.75186,-2.38805 0.76364,-2.61578 0.10994,-2.91362 -0.46276,-0.21086 -0.96083,-0.15595 -2.25392,0.24345 -3.93477,1.21532 -8.19071,1.60604 -11.03406,1.0131 -3.01927,-0.62964 -5.81542,-2.56175 -7.06808,-4.87697 -0.80643,-1.4905 -0.78281,-5.77539 0.0472,-8.41888 0.47027,-1.49791 3.13702,-7.91564 3.42409,-8.23823 0.037,-0.0415 0.43312,0.25977 0.87957,0.66754 1.68352,1.53765 5.71955,2.00443 13.93197,1.6178 l 4.24871,-0.20418 0.32984,-1.38221 c 0.18151,-0.76021 0.87677,-2.86333 1.53927,-4.68063 0.86933,-2.38472 1.12449,-3.04334 1.3979,-3.07069 z" fill="black" />
      </g>
    </mask>
  </defs>

  <style>
    /* CSS Animations for high-performance fluid motion */
    .spin-slow { animation: spin 40s linear infinite; transform-origin: center; }
    .spin-slow-reverse { animation: spin-rev 50s linear infinite; transform-origin: center; }
    .spin-fast { animation: spin 20s linear infinite; transform-origin: center; }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-rev { 100% { transform: rotate(-360deg); } }

    .float { animation: floating 6s ease-in-out infinite alternate; }
    @keyframes floating {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    .pulse-glow { animation: pulse 3s ease-in-out infinite alternate; transform-origin: 0 0; }
    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* Packet flow */
    .packet-1 { animation: flow-1 3s linear infinite; opacity: 0; }
    @keyframes flow-1 {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    
    .status-ping { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; transform-origin: 0 0; }
    @keyframes ping {
      75%, 100% { transform: scale(2.5); opacity: 0; }
    }
  </style>

  <!-- Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#fine-grid)" />

  <!-- Ambient Glow -->
  <g transform="translate(900, 200)">
    <circle cx="0" cy="0" r="250" fill="url(#cyan-glow)" filter="url(#blur-heavy)" class="pulse-glow" />
  </g>
  <circle cx="200" cy="300" r="200" fill="rgba(99, 102, 241, 0.08)" filter="url(#blur-heavy)" /> <!-- Indigo tint -->

  <!-- Central Shield -->
  <g transform="translate(600, 200)">
    <!-- Static glow centered slightly above to shine through the dove -->
    <circle cx="0" cy="-10" r="95" fill="rgba(56, 189, 248, 0.3)" filter="url(#blur-heavy)" class="pulse-glow" />
    
    <g class="float">
      <!-- Shield with Mask -->
      <path d="M 0 -120 L 100 -90 L 100 20 C 100 80 50 110 0 130 C -50 110 -100 80 -100 20 L -100 -90 Z" 
            fill="url(#shield-solid)" stroke="#38bdf8" stroke-width="2" mask="url(#dove-cutout)" />
            
      <!-- Shield Inner Outline -->
      <path d="M 0 -110 L 90 -83 L 90 18 C 90 70 45 98 0 115 C -45 98 -90 70 -90 18 L -90 -83 Z" 
            fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    </g>
  </g>

  <!-- Architectural Accents -->
  <line x1="0" y1="399" x2="1200" y2="399" stroke="#1e293b" stroke-width="1" />
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#1e293b" stroke-width="1" />
  <!-- Corner brackets -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#475569" stroke-width="1.5" />
  <path d="M 1180 40 L 1180 20 L 1160 20" fill="none" stroke="#475569" stroke-width="1.5" />
  <path d="M 20 360 L 20 380 L 40 380" fill="none" stroke="#475569" stroke-width="1.5" />
  <path d="M 1180 360 L 1180 380 L 1160 380" fill="none" stroke="#475569" stroke-width="1.5" />

  <!-- Bible Verse Overlay (Right Side) - Premium Aesthetic Card -->
  <g transform="translate(765, 48)">
    <defs>
      <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
        <stop offset="100%" stop-color="rgba(2, 6, 23, 0.8)" />
      </linearGradient>
      <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(125, 211, 252, 0.4)" />
        <stop offset="50%" stop-color="rgba(255, 255, 255, 0.05)" />
        <stop offset="100%" stop-color="rgba(255, 255, 255, 0.0)" />
      </linearGradient>
      <linearGradient id="card-border-bottom" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="rgba(255, 255, 255, 0.0)" />
        <stop offset="50%" stop-color="rgba(255, 255, 255, 0.05)" />
        <stop offset="100%" stop-color="rgba(14, 165, 233, 0.2)" />
      </linearGradient>
      <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.7" />
      </filter>
      <radialGradient id="card-glow-1" cx="0%" cy="0%" r="70%">
        <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
        <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
      </radialGradient>
      <clipPath id="card-clip">
        <rect width="400" height="305" rx="16" />
      </clipPath>
    </defs>

    <!-- Shadow -->
    <rect x="0" y="0" width="400" height="305" rx="16" fill="#000000" filter="url(#drop-shadow)" opacity="0.4" />
    
    <!-- Base Glass -->
    <rect x="0" y="0" width="400" height="305" rx="16" fill="url(#card-grad)" style="backdrop-filter: blur(16px);" />
    
    <!-- Inner Glows (clipped to card) -->
    <g clip-path="url(#card-clip)">
      <circle cx="0" cy="0" r="250" fill="url(#card-glow-1)" />
    </g>

    <!-- Dual Borders for 3D Edge effect -->
    <rect x="0.5" y="0.5" width="399" height="304" rx="15.5" fill="none" stroke="url(#card-border)" stroke-width="1.5" />
    <rect x="0.5" y="0.5" width="399" height="304" rx="15.5" fill="none" stroke="url(#card-border-bottom)" stroke-width="1" opacity="0.7" />
    
    <!-- Accent Line (Top edge) -->
    <rect x="30" y="0" width="60" height="2" fill="#38bdf8" filter="url(#glow-sharp)" />

    <!-- Big Decorative Quote Mark (Watermark) -->
    <text x="360" y="110" font-family="'Georgia', serif" font-size="140" font-weight="900" fill="rgba(56, 189, 248, 0.05)" text-anchor="end">
      ”
    </text>

    <!-- Pill / Tag -->
    <g transform="translate(30, 25)">
      <rect width="65" height="20" rx="10" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="12" cy="10" r="3" fill="#38bdf8" filter="url(#glow-sharp)" />
      <text x="38" y="14" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">
        KJV HB
      </text>
    </g>

    <!-- Eyebrow -->
    <text x="105" y="39" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2">
      2 TIMOTHY 2:19-21
    </text>

    <!-- Verse Text (Airy & Elegant) -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      <tspan x="30" y="75">"<tspan fill="#7dd3fc" font-size="11" font-weight="600">19 </tspan>Nevertheless the foundation of God standeth sure,</tspan>
      <tspan x="30" y="98">having this seal, The Lord knoweth them that are his.</tspan>
      <tspan x="30" y="121">And, <tspan fill="#f8fafc" font-weight="600">let every one that nameth the name of Christ</tspan></tspan>
      <tspan x="30" y="144"><tspan fill="#f8fafc" font-weight="600">depart from iniquity.</tspan> <tspan fill="#7dd3fc" font-size="11" font-weight="600">20 </tspan>But in a great house there</tspan>
      <tspan x="30" y="167">are not only vessels of gold and of silver, but also</tspan>
      <tspan x="30" y="190">of wood and of earth; and some to honour, and some</tspan>
      <tspan x="30" y="213">to dishonour. <tspan fill="#7dd3fc" font-size="11" font-weight="600">21 </tspan><tspan fill="#f8fafc" font-weight="600">If a man therefore purge himself</tspan></tspan>
      <tspan x="30" y="236"><tspan fill="#f8fafc" font-weight="600">from these, he shall be a vessel unto honour,</tspan></tspan>
      <tspan x="30" y="259"><tspan fill="#f8fafc" font-weight="600">sanctified, and meet for the master's use, and</tspan></tspan>
      <tspan x="30" y="282"><tspan fill="#f8fafc" font-weight="600">prepared unto every good work.</tspan>"</tspan>
    </text>
  </g>

  <!-- Typography & Information (Left Side) -->
  <g transform="translate(115, 150)">
    
    <!-- Small technical eyebrow text -->
    <text x="0" y="-80" font-family="'SF Mono', Consolas, monospace" font-size="12" fill="#64748b" letter-spacing="2">
      // V2.3.0 &#183; KERNEL-LEVEL PROTECTION
    </text>

    <!-- Main Branding -->
    <text x="-3" y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="72" font-weight="800" fill="url(#metal-text)" letter-spacing="-2.5">
      CALVARY
    </text>
    <text x="2" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#94a3b8" letter-spacing="8">
      PORN BLOCKER
    </text>
    
    <!-- Subtitle / Tagline -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#64748b" letter-spacing="0.5">
      <tspan x="2" y="55">Christian multi-layered protection featuring</tspan>
      <tspan x="2" y="75">SafeSearch, app blocking, and intelligent</tspan>
      <tspan x="2" y="95">media blurring. Safe for families, ministries,</tspan>
      <tspan x="2" y="115">schools, colleges, and businesses,</tspan>
      <tspan x="2" y="135">absolutely free.</tspan>
    </text>

    <!-- Sleek Status Pill -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      
      <!-- Pulsing Dot -->
      <g transform="translate(16, 14)">
        <circle cx="0" cy="0" r="4" fill="#10b981" filter="url(#glow-sharp)" />
        <circle cx="0" cy="0" r="4" fill="#10b981" class="status-ping" />
      </g>
      
      <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" fill="#34d399" font-weight="600" letter-spacing="1">
        SYSTEM ACTIVE
      </text>
    </g>

    <!-- Data metric (just for aesthetic technical feel) -->
    <g transform="translate(180, 165)">
      <rect x="0" y="0" width="140" height="28" rx="4" fill="rgba(30, 41, 59, 0.4)" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#94a3b8">
        LATENCY: <tspan fill="#22d3ee">1.2ms</tspan>
      </text>
    </g>
  </g>
</svg>

